[pytest]
# Configurações do pytest

# Diretório de testes
testpaths = tests

# Padrão de arquivos de teste
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opções padrão
# NOTA: Não definir --html aqui para permitir nome dinâmico por device
# Use parallel_runner.py para gerar relatórios com nome do device
addopts =
    -v
    --tb=short
    --strict-markers
    --cache-clear
    -p no:cacheprovider

# Markers customizados
markers =
    smoke: Testes de sanidade rapida (rodam primeiro, ~2 min)
    unit: Testes unitarios (sem Appium, ~1 seg)
    locators: Testes de validacao de locators (sem Appium)
    e2e: Testes end-to-end completos (com Appium)
    regression: Testes de regressao (completos)
    slow: Testes lentos
    wip: Work in progress (nao executar)

# Carrega variáveis do .env
env_files = .env

# Log - Modo Normal (limpo, sem timestamp/nível)
# Para modo DEBUG, use: set DEBUG_MODE=true
log_cli = true
log_cli_level = INFO
log_cli_format = %(message)s
log_cli_date_format =

# Configurações para capturar logs no relatório HTML
# Captura logs do projeto, filtra bibliotecas externas
log_level = INFO
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] %(name)s:%(filename)s:%(lineno)s - %(message)s
log_file_date_format = %H:%M:%S

# Filtra logs de bibliotecas externas (só mostra WARNING+)
# No modo normal, bibliotecas só mostram avisos/erros
# No modo DEBUG, isso é sobrescrito pela flag -vv
log_selenium.webdriver = WARNING
log_urllib3 = WARNING
log_appium = WARNING
